name: NutriScan CI & Automated Testing

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run every Monday at midnight UTC
    - cron: '0 0 * * 1'

jobs:
  test-and-verify:
    name: Run Pytest Test Suite & API Validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Validate syntax across all Python files
        run: |
          python -m py_compile $(find app tests -name "*.py")

      - name: Run full Pytest test suite (11/11 tests)
        run: |
          PYTHONPATH=. pytest tests/ -v --tb=short
